name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Domyślnie false: tak przychodzi build od zewnętrznego systemu bloga (ingest.php,
      # bez parametrów) i "Pełny build" z panelu — wtedy blog MUSI się zbudować i wgrać.
      skip_blog:
        description: "Nie buduj i nie wgrywaj /blog (szybszy deploy). Tylko gdy zmiany nie dotykają stopki, nawigacji, kontaktu ani wspólnych komponentów."
        type: boolean
        default: false
      exclude:
        description: "Pomiń przy wgrywaniu (po przecinku), np. blog/, /inwestycja/rudava-park, api/. Doliczane do pliku .deploy-exclude."
        type: string
        default: ""

# Jeden deploy naraz (np. push + build zlecony przez system bloga) — kolejny czeka,
# zamiast wgrywać na FTP równolegle i nadpisywać sobie stan synchronizacji.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Cache node_modules bezpośrednio (nie tylko rejestr npm) — przy trafieniu
      # w cache pomijamy "npm ci" całkowicie, bo lockfile się nie zmienił.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # Build zawsze od zera: bez przywracania .next/cache. Trwały cache Turbopacka
      # (.next/cache/turbopack) przywrócony z wcześniejszego builda psuł kompilację
      # fontów ("next/font/google queries have exactly one entry" dla Roboto).
      # TODO: wrócić do cache'owania, gdy build będzie stabilny (wydajność).
      - name: Clean Next.js cache
        run: rm -rf .next

      # Zakres deployu:
      #   push na main            -> BEZ bloga (wpisy dodaje zewnętrzny system i sam zleca build),
      #                              chyba że opis commita zawiera [full] — wtedy wszystko;
      #   ręcznie / panel / ingest -> wg pola skip_blog (domyślnie false = z blogiem).
      - name: Decide deploy scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_SKIP_BLOG: ${{ inputs.skip_blog }}
        run: |
          if [ "$EVENT" = "push" ]; then
            if printf '%s' "$COMMIT_MESSAGE" | grep -qiF '[full]'; then
              skip=false
              echo "### 🔁 Push z [full] — pełny deploy razem z blogiem" >> "$GITHUB_STEP_SUMMARY"
            else
              skip=true
              echo "### ⏩ Push — blog pominięty (budowa i wgrywanie). Pełny deploy: [full] w opisie commita albo \"Pełny build\" w panelu." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            skip="${INPUT_SKIP_BLOG:-false}"
          fi
          echo "skip_blog=$skip" >> "$GITHUB_OUTPUT"
          echo "skip_blog=$skip"

      - name: Build
        env:
          SKIP_BLOG_BUILD: ${{ steps.scope.outputs.skip_blog == 'true' && '1' || '' }}
        run: npm run build

      # Pliki JS/CSS z wcześniejszych buildów zostają w out/_next/static (nazwy są
      # haszami treści, więc nic się nie nadpisuje). Bez tego deploy kasowałby z serwera
      # pliki, których nie ma w nowym buildzie — a strony pominięte w tym deployu (blog,
      # wykluczenia) wciąż się do nich odwołują i straciłyby style/skrypty.
      - name: Restore previous static assets
        uses: actions/cache/restore@v4
        with:
          path: .static-archive
          key: next-static-${{ github.run_id }}
          restore-keys: next-static-

      - name: Keep previous static assets in out/
        run: |
          mkdir -p .static-archive out/_next/static
          before=$(find out/_next/static -type f | wc -l)
          cp -rn .static-archive/. out/_next/static/
          after=$(find out/_next/static -type f | wc -l)
          echo "Zachowane pliki z poprzednich buildów: $((after - before))"
          rm -rf .static-archive && cp -r out/_next/static .static-archive

      - name: Save static assets archive
        uses: actions/cache/save@v4
        with:
          path: .static-archive
          key: next-static-${{ github.run_id }}

      - name: Assemble backend into out/api
        run: |
          mkdir -p out/api
          cp -r backend/index.php backend/admin.php backend/ingest.php backend/cron.php backend/v1.php backend/.htaccess backend/src out/api/
          # ŚWIADOMIE bez .env tutaj. To plik konfiguracji SERWERA (dane do bazy,
          # sekrety), nie kod — wgrywasz go RAZ ręcznie przez FTP i zostaje tam
          # na stałe (patrz "exclude" w kroku "Deploy to FTP" niżej, który chroni
          # go przed skasowaniem przez clean-slate). CI nigdy go nie generuje ani
          # nie nadpisuje — to był dotąd cały problem: brakujący sekret w GitHub
          # = puste pole w .env = serwer się psuł po KAŻDYM pushu.

      # Zredukowane do jednej linii - tylko szybki sanity check, bez pełnego
      # listowania katalogów (oszczędza ~10s przy każdym uruchomieniu).
      - name: Verify build output
        run: |
          test -f ./out/index.html || (echo "❌ index.html missing!" && exit 1)
          test -f ./out/api/index.php || (echo "❌ api/index.php missing!" && exit 1)
          test -f ./out/api/v1.php || (echo "❌ api/v1.php missing!" && exit 1)
          echo "✅ Build OK: $(sha256sum ./out/index.html)"

      # Lista wykluczeń = plik .deploy-exclude + pole "exclude" (ręczne uruchomienie)
      # + blog/, gdy zakres deployu go pomija (krok "Decide deploy scope"). Normalizacja
      # i blokada niebezpiecznych wzorców (_next/**) — scripts/deploy-exclude.sh.
      - name: Prepare FTP exclude list
        id: exclude
        env:
          INPUT_EXCLUDE: ${{ inputs.exclude }}
          SKIP_BLOG: ${{ steps.scope.outputs.skip_blog }}
        run: |
          patterns="$(bash scripts/deploy-exclude.sh)"
          {
            echo "patterns<<EXCLUDE_EOF"
            echo "$patterns"
            echo "EXCLUDE_EOF"
          } >> "$GITHUB_OUTPUT"
          skipped="$(echo "$patterns" | grep -v -e '^\*\*/\.env$' -e '^api/raporty-cen/\*\*$' || true)"
          if [ -n "$skipped" ]; then
            {
              echo "### ⏭️ Pominięte przy wgrywaniu na FTP"
              echo "Te ścieżki zostały na serwerze w poprzedniej wersji:"
              echo '```'
              echo "$skipped"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy z wykluczeniami::$(echo "$skipped" | paste -sd ' ' -)"
          else
            echo "### ✅ Pełny deploy — nic nie pominięto" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
          # clean-slate: true
          # .env na serwerze (dane do bazy, tokeny) przeżywa clean-slate — nie ma
          # go w out/, więc bez tego wpisu zostałby skasowany jako "plik, którego
          # już nie ma lokalnie". Wgrywasz go raz ręcznie, zostaje tam na stałe.
          # Wykluczone ścieżki nie są ani wgrywane, ani kasowane na serwerze.
          exclude: ${{ steps.exclude.outputs.patterns }}
