name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble backend into out/api
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_AUTH_ENABLED: ${{ secrets.ADMIN_AUTH_ENABLED }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          mkdir -p out/api
          cp -r backend/index.php backend/admin.php backend/.htaccess backend/src out/api/
          {
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=3306"
            echo "DB_NAME=${DB_NAME}"
            echo "DB_USER=${DB_USER}"
            echo "DB_PASS=${DB_PASS}"
            echo "APP_DEBUG=false"
            echo "CORS_ALLOWED_ORIGIN=*"
            # Dane logowania NIE są tu generowane — logowanie sprawdza się
            # względem tabeli `users` w bazie, patrz db/005_create_users_table.sql.
            # Domyślnie "false" (sekret ADMIN_AUTH_ENABLED jeszcze nie ustawiony) —
            # panel jest wtedy otwarty dla każdego, kto zna adres.
            echo "ADMIN_AUTH_ENABLED=${ADMIN_AUTH_ENABLED:-false}"
            # GH_DISPATCH_TOKEN, bo GitHub Actions nie pozwala nazwać sekretu
            # "GITHUB_TOKEN" (nazwa zastrzeżona) — w .env zostaje już pod
            # docelową nazwą, której oczekuje GithubDispatcher.php.
            echo "GITHUB_TOKEN=${GH_DISPATCH_TOKEN}"
            echo "GITHUB_OWNER=AdamSynowiec"
            echo "GITHUB_REPO=kgd-group-nextjs"
            echo "GITHUB_WORKFLOW=deploy.yml"
            echo "GITHUB_REF=main"
          } > out/api/.env

      - name: Check build output
        run: |
          echo "=== OUT DIRECTORY ==="
          ls -lah ./out/
          echo "=== API DIRECTORY ==="
          ls -lah ./out/api/
          echo "=== INDEX ==="
          ls -lah ./out/index.html
          echo "=== INDEX HASH ==="
          sha256sum ./out/index.html

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
          clean-slate: true
