name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble backend into out/api
        run: |
          mkdir -p out/api
          cp -r backend/index.php backend/admin.php backend/.htaccess backend/src out/api/
          # ŚWIADOMIE bez .env tutaj. To plik konfiguracji SERWERA (dane do bazy,
          # sekrety), nie kod — wgrywasz go RAZ ręcznie przez FTP i zostaje tam
          # na stałe (patrz "exclude" w kroku "Deploy to FTP" niżej, który chroni
          # go przed skasowaniem przez clean-slate). CI nigdy go nie generuje ani
          # nie nadpisuje — to był dotąd cały problem: brakujący sekret w GitHub
          # = puste pole w .env = serwer się psuł po KAŻDYM pushu.

      - name: Check build output
        run: |
          echo "=== OUT DIRECTORY ==="
          ls -lah ./out/
          echo "=== API DIRECTORY ==="
          ls -lah ./out/api/
          echo "=== INDEX ==="
          ls -lah ./out/index.html
          echo "=== INDEX HASH ==="
          sha256sum ./out/index.html

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
          # clean-slate: true
          # .env na serwerze (dane do bazy, tokeny) przeżywa clean-slate — nie ma
          # go w out/, więc bez tego wpisu zostałby skasowany jako "plik, którego
          # już nie ma lokalnie". Wgrywasz go raz ręcznie, zostaje tam na stałe.
          exclude: |
            **/.env
